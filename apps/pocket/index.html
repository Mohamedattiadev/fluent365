<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F9F9F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Fluent365: guided daily English practice. Grammar, vocabulary, reading, listening, writing, speaking and IELTS." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Fluent365</title>
    <script>
      // Opening screen: use the saved theme straight away (light, dark or the device setting).
      try { var l = JSON.parse(localStorage.getItem("f365-look") || "{}"); if (l.theme === "light" || l.theme === "dark") document.documentElement.dataset.theme = l.theme; if (l.accent) document.documentElement.dataset.accent = l.accent; } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; background: #f9f9f9; color: #1b1b1b; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]), html:not([data-theme="light"]) body { background: #131313; color: #e2e2e2; } }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #131313; color: #e2e2e2; }
      /* Opening screen: the mark alone, like a native app; the name sits quietly at the bottom. */
      .splash { position: fixed; inset: 0; display: grid; place-items: center; font: 500 14px/1 Roboto, system-ui, sans-serif; letter-spacing: .08em; --pen: #7b61ff; }
      html[data-accent="blue"] .splash { --pen: #2f6fe0; } html[data-accent="orange"] .splash { --pen: #d65a00; } html[data-accent="mono"] .splash { --pen: currentColor; }
      .splash .mark { width: 96px; height: 96px; animation: f365in 500ms cubic-bezier(.2,.8,.2,1) both; }
      .splash .name { position: absolute; bottom: calc(40px + env(safe-area-inset-bottom)); opacity: .55; }
      @keyframes f365in { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .splash .mark { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="splash" role="status"><svg class="mark" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><g transform="translate(256 256) scale(1.12) translate(-256 -256)"><path d="M324.1 207.7A132 132 0 1 1 221.4 164.1" fill="none" stroke="currentColor" stroke-width="54" stroke-linecap="round"/><g fill="var(--pen, #7b61ff)" transform="translate(324.1 207.7) rotate(38)"><path d="M0 -4 L-23.0 -50.6 H23.0 Z"/><rect x="-23.0" y="-150.6" width="46" height="102" rx="11.5"/></g></g></svg><span class="name">FLUENT365</span></div></div>
    <noscript>Fluent365 needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
