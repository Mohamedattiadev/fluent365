<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Android: the browser paints its window (behind the nav bar, overscroll, first frame) in this scheme before any CSS loads -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#F9F9F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Fluent365: guided daily English practice. Grammar, vocabulary, reading, listening, writing, speaking and IELTS." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-g1.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/icon-192-g1.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-g1.png" />
    <title>Fluent365</title>
    <script>
      // Opening screen: use the saved theme straight away (light, dark or the device setting).
      try { var l = JSON.parse(localStorage.getItem("f365-look") || "{}"); if (l.theme === "light" || l.theme === "dark") document.documentElement.dataset.theme = l.theme; if (l.accent) document.documentElement.dataset.accent = l.accent; } catch (e) {}
      // Installed app: Android/iOS already showed the icon on its own opening screen, so ours shows no second logo.
      try { if (matchMedia("(display-mode: standalone)").matches || navigator.standalone) document.documentElement.dataset.standalone = "1"; } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; background: #f9f9f9; color: #1b1b1b; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]), html:not([data-theme="light"]) body { background: #131313; color: #e2e2e2; } }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #131313; color: #e2e2e2; }
      /* Opening screen: the logo does the loading (the ring fills like today's progress) above the wordmark. */
      .splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; --pen: #7b61ff; }
      html[data-accent="blue"] .splash { --pen: #2f6fe0; } html[data-accent="orange"] .splash { --pen: #d65a00; } html[data-accent="mono"] .splash { --pen: currentColor; }
      .splash .mark { width: 104px; height: 104px; }
      html[data-standalone] .splash > * { visibility: hidden; }
      .splash .arc { stroke-dasharray: 100 100; stroke-dashoffset: 100; animation: f365fill 1.6s cubic-bezier(.4,0,.2,1) forwards; }
      .splash .wm { font: 400 26px/1 Roboto, system-ui, sans-serif; letter-spacing: -.01em; }
      .splash .wm b { font-weight: 700; color: var(--pen); }
      @keyframes f365fill { to { stroke-dashoffset: 75; } }
      @media (prefers-reduced-motion: reduce) { .splash .arc { animation: none; stroke-dashoffset: 75; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="splash" role="status"><svg class="mark" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><circle cx="256" cy="256" r="176" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width="30"/><circle class="arc" cx="256" cy="256" r="176" fill="none" stroke="var(--pen, #7b61ff)" stroke-width="30" stroke-linecap="round" pathLength="100" transform="rotate(-90 256 256)" stroke-dasharray="25 100"/><path d="M251.0 345.0 C203.5 319.0 167.8 323.0 151.0 339.0 V201.0 C167.8 185.0 203.5 187.0 251.0 215.0 Z" fill="currentColor"/><path d="M261.0 345.0 C308.5 319.0 344.2 323.0 361.0 339.0 V201.0 C344.2 185.0 308.5 187.0 261.0 215.0 Z" fill="currentColor"/></svg><div class="wm">Fluent<b>365</b></div></div></div>
    <noscript>Fluent365 needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
