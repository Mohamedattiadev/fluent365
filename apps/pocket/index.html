<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F9F9F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Fluent365: guided daily English practice. Grammar, vocabulary, reading, listening, writing, speaking and IELTS." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Fluent365</title>
    <script>
      // Opening screen: use the saved theme straight away (light, dark or the device setting).
      try { var l = JSON.parse(localStorage.getItem("f365-look") || "{}"); if (l.theme === "light" || l.theme === "dark") document.documentElement.dataset.theme = l.theme; if (l.accent) document.documentElement.dataset.accent = l.accent; } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; background: #f9f9f9; color: #1b1b1b; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]), html:not([data-theme="light"]) body { background: #131313; color: #e2e2e2; } }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #131313; color: #e2e2e2; }
      .splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font: 500 22px/1.2 Roboto, system-ui, sans-serif; letter-spacing: .01em; }
      .splash img { width: 88px; height: 88px; border-radius: 22px; animation: f365pop 420ms cubic-bezier(.2,.8,.2,1) both; }
      .splash i { width: 28px; height: 3px; border-radius: 3px; background: #5b3fd9; opacity: .8; animation: f365bar 1.1s ease-in-out infinite alternate; }
      html[data-accent="blue"] .splash i { background: #1f5fd6; } html[data-accent="orange"] .splash i { background: #d65a00; } html[data-accent="mono"] .splash i { background: currentColor; }
      @keyframes f365pop { from { transform: scale(.86); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes f365bar { from { width: 18px; } to { width: 56px; } }
      @media (prefers-reduced-motion: reduce) { .splash img, .splash i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="splash" role="status"><img src="./icons/icon.svg" alt="" width="88" height="88" /><span>Fluent365</span><i aria-hidden="true"></i></div></div>
    <noscript>Fluent365 needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
